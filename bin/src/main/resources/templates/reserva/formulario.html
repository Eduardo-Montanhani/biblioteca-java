<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Biblioteca</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
</head>
<body>
<div class="container">
  <a type="button" class="btn btn-outline-info" th:href="@{/}">Home</a>
  <a type="button" class="btn btn-outline-info" th:href="@{/reserva/lista}">Lista</a>
  <h1><span th:text="${listaReservas}"></span></h1>

  <form>
    <div class="mb-3">
      <input name="id" th:value="${reserva.id}" type="text" hidden="true">

      <label class="form-label">Nome do Aluno</label>
      <select th:field="${reserva.aluno.id}" class="form-control">
        <option value="" selected="selected">...</option>
        <option th:each="aluno : ${listaDeAlunos}" th:value="${aluno.id}" th:text="${aluno.nome}"></option>
      </select>

      <label class="form-label">Título do Livro</label>
      <select th:field="${reserva.livro.id}" class="form-control">
        <option value="" selected="selected">...</option>
        <option th:each="livro : ${listaDeLivros}" th:value="${livro.id}" th:text="${livro.nome}"></option>
      </select>

      <label class="form-label">Data Início</label>
      <input name="dataInicio" th:value="${reserva.dataInicio}" type="date" class="form-control">

      <label class="form-label">Data Fim</label>
      <input name="dataFim" th:value="${reserva.dataFim}" type="date" class="form-control">

      <label class="form-label">Observação</label>
      <input name="observacao" th:value="${reserva.observacao}" type="text" class="form-control">

    </div>

    <button th:formaction="@{/reserva/salvar}" formmethod="post" type="submit" class="btn btn-dark">Salvar</button>

  </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
        crossorigin="anonymous"></script>
</body>
</html>
