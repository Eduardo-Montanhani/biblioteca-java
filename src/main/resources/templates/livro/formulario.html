<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
</head>
<body>
<div class="container">
    <a type="button" class="btn btn-outline-info" th:href="@{/}">Home</a>
    <a type="button" class="btn btn-outline-info" th:href="@{/livro/lista}">Lista</a>
    <h1><span th:text="${listaLivros}"></span></h1>

    <form>
        <div class="mb-3">
            <input name="id" th:value="${livro.id}" type="text" hidden="true">

            <label class="form-label">Título do Livro</label>
            <input name="livro" th:value="${livro.titulo}" type="text" class="form-control">

            <label class="form-label">Subtítulo do Livro</label>
            <input name="subTitulo" th:value="${livro.subTitulo}" type="text" class="form-control">

            <label class="form-label">ISBN</label>
            <input name="isbn" th:value="${livro.isbn}" type="text" class="form-control">

            <label class="form-label">Autor</label>
            <select th:field="${livro.autor.id}" class="form-control">
                <option value="" selected="selected">...</option>
                <option th:each="autor : ${listaDeAutores}" th:value="${autor.id}" th:text="${autor.nome}"></option>
            </select>

            <label class="form-label">Editora</label>
            <select th:field="${livro.editora.id}" class="form-control">
                <option value="" selected="selected">...</option>
                <option th:each="editora : ${listaDeEditores}" th:value="${editora.id}" th:text="${editora.nome}"></option>
            </select>

            <label class="form-label">Categorias</label>
            <input name="categoria" th:value="${livro.categoria}" type="text" class="form-control">

            <label class="form-label">Local</label>
            <input name="local" th:value="${livro.local}" type="text" class="form-control">

            <label class="form-label">Ano</label>
            <input name="ano" th:value="${livro.ano}" type="number" class="form-control">

        </div>

        <button th:formaction="@{/livro/salvar}" formmethod="post" type="submit" class="btn btn-dark">Salvar</button>

    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
        crossorigin="anonymous"></script>
</body>
</html>
