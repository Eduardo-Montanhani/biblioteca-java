<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
</head>
<body>
<div class="container">
    <a type="button" class="btn btn-outline-info" th:href="@{/}">Home</a>
    <a type="button" class="btn btn-outline-info" th:href="@{/reserva/formulario}">Novo</a>
    <h1><span th:text="${listaReservas}"></span></h1>

    <table class="table">
        <thead>
        <tr>
            <th scope="col">ID</th>
            <th scope="col">Nome do Aluno</th>
            <th scope="col">Título do Livro</th>
            <th scope="col">Data Início</th>
            <th scope="col">Data Fim</th>
            <th scope="col">Observação</th>
            <th scope="col">Outros</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="reserva : ${listaDeReservas}">
            <th th:text="${reserva.id}"></th>
            <th th:text="${reserva.aluno.id}"></th>
            <th th:text="${reserva.livro.id}"></th>
            <th th:text="${#temporals.format(reserva.dataInicio,'dd/MM/yyyy)}"></th>
            <th th:text="${#temporals.format(reserva.dataFim,'dd/MM/yyyy)}"></th>
            <th th:text="${reserva.observacao}"></th>

            <td>
                <a th:href="@{'/reserva/alterar/' + ${reserva.id}}" type="button" class="btn btn-warning">Alterar</a>
                <a th:href="@{'/reserva/remover/' + ${reserva.id}}" type="button" class="btn btn-danger">Remover</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
        crossorigin="anonymous"></script>
</body>
</html>
