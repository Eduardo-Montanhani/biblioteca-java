<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #f0f2f5, #e3e6ea);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            margin-top: 50px;
            transition: transform 0.3s;
        }

        .container:hover {
            transform: translateY(-3px);
        }

        h1.section-title {
            font-size: 28px;
            font-weight: bold;
            color: #0d6efd;
            border-left: 5px solid #0d6efd;
            padding-left: 15px;
            margin-bottom: 30px;
        }

        .btn-custom {
            width: 100%;
            margin-bottom: 15px;
            padding: 15px;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease-in-out;
        }

        .btn-custom i {
            font-size: 18px;
        }

        .btn-custom:hover {
            transform: scale(1.03);
        }

        @media (min-width: 576px) {
            .grid-buttons {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                gap: 15px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="section-title">Cadastros</h1>
    <div class="grid-buttons">
        <a class="btn btn-outline-primary btn-custom" th:href="@{/aluno/formulario}"><i class="bi bi-person-plus"></i> Cadastrar Aluno</a>
        <a class="btn btn-outline-primary btn-custom" th:href="@{/curso/formulario}"><i class="bi bi-journal-plus"></i> Cadastrar Curso</a>
        <a class="btn btn-outline-primary btn-custom" th:href="@{/livro/formulario}"><i class="bi bi-book"></i> Cadastrar Livro</a>
        <a class="btn btn-outline-primary btn-custom" th:href="@{/reserva/formulario}"><i class="bi bi-calendar-plus"></i> Cadastrar Reserva</a>
        <a class="btn btn-outline-primary btn-custom" th:href="@{/autor/formulario}"><i class="bi bi-person-lines-fill"></i> Cadastrar Autor</a>
        <a class="btn btn-outline-primary btn-custom" th:href="@{/editora/formulario}"><i class="bi bi-building"></i> Cadastrar Editora</a>
    </div>
</div>

<div class="container">
    <h1 class="section-title">Listagens</h1>
    <div class="grid-buttons">
        <a class="btn btn-outline-success btn-custom" th:href="@{/aluno/lista}"><i class="bi bi-people"></i> Listar Alunos</a>
        <a class="btn btn-outline-success btn-custom" th:href="@{/curso/lista}"><i class="bi bi-journal-text"></i> Listar Cursos</a>
        <a class="btn btn-outline-success btn-custom" th:href="@{/livro/lista}"><i class="bi bi-book-half"></i> Listar Livros</a>
        <a class="btn btn-outline-success btn-custom" th:href="@{/reserva/lista}"><i class="bi bi-calendar-event"></i> Listar Reservas</a>
        <a class="btn btn-outline-success btn-custom" th:href="@{/autor/lista}"><i class="bi bi-person-badge"></i> Listar Autores</a>
        <a class="btn btn-outline-success btn-custom" th:href="@{/editora/lista}"><i class="bi bi-building-fill"></i> Listar Editoras</a>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
        crossorigin="anonymous"></script>
</body>
</html>
