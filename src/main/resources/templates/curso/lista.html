<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Biblioteca</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
</head>
<body>
<div class="container">
  <a type="button" class="btn btn-outline-info" th:href="@{/}">Home</a>
  <a type="button" class="btn btn-outline-info" th:href="@{/curso/formulario}">Novo</a>
  <h1><span th:text="${cursoMain}"></span></h1>

  <table class="table">
    <thead>
    <tr>
      <th scope="col">ID</th>
      <th scope="col">Nome do Curso</th>
      <th scope="col">Coordenador</th>
      <th scope="col">Duração</th>
      <th scope="col">Outros</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="curso : ${listaDeCursoss}">
      <th th:text="${curso.id}"></th>
      <td th:text="${curso.nome}"></td>
      <td th:text="${curso.coordenador}"></td>
      <td th:text="${curso.duracao}"></td>

      <td>
        <a th:href="@{'/curso/alterar/' + ${curso.id}}" type="button" class="btn btn-warning">Alterar</a>
        <a th:href="@{'/curso/remover/' + ${curso.id}}" type="button" class="btn btn-danger">Remover</a>
      </td>
    </tr>
    </tbody>
  </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
        crossorigin="anonymous"></script>
</body>
</html>
