<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
</head>
<body>
<div class="container">
    <a type="button" class="btn btn-outline-info" th:href="@{/}">Home</a>
    <a type="button" class="btn btn-outline-info" th:href="@{/aluno/lista}">Lista</a>
    <h1><span th:text="${cadastroAlunos}"></span></h1>

    <form>
        <div class="mb-3">
            <input name="id" th:value="${aluno.id}" type="text" hidden="true">

            <label class="form-label">RA</label>
            <input name="ra" th:value="${aluno.ra}" type="number" class="form-control">

            <label class="form-label">Nome do Aluno</label>
            <input name="nome" th:value="${aluno.nome}" type="text" class="form-control">

            <label class="form-label">Senha</label>
            <input name="senha" th:value="${aluno.senha}" type="password" class="form-control">

            <label class="form-label">Endereço</label>
            <input name="endereco" th:value="${aluno.endereco}" type="text" class="form-control">

            <label class="form-label">Cidade</label>
            <input name="cidade" th:value="${aluno.cidade}" type="text" class="form-control">

            <label class="form-label">UF</label>
            <input name="uf" th:value="${aluno.uf}" type="text" class="form-control">

            <label class="form-label">Telefone</label>
            <input name="telefone" th:value="${aluno.telefone}" type="number" class="form-control">

            <label class="form-label">Curso</label>
            <select th:field="${aluno.curso.id}" class="form-control">
                <option value="" selected="selected">Selecione...</option>
                <option th:each="curso : ${listaDeCursos}" th:value="${curso.id}" th:text="${curso.nome}"></option>
            </select>
        </div>

        <button th:formaction="@{/aluno/salvar}" formmethod="post" type="submit" class="btn btn-dark">Salvar</button>

    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
        crossorigin="anonymous"></script>
</body>
</html>
